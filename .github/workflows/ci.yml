name: ci

# ABGESCHALTET 2026-07-29 (Projektabschluss): automatische Ausloeser stillgelegt.
# Es feuert nichts mehr von selbst; ein Lauf ist nur noch von Hand ueber
# workflow_dispatch moeglich. Zum Reaktivieren die Kommentarzeichen unten entfernen.
on:
#  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest
